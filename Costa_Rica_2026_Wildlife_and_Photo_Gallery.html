  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f14;
      color: #f1f5f9;
    }
    .serif-title {
      font-family: 'Playfair Display', Georgia, serif;
    }
    .card-zoom:hover img {
      transform: scale(1.05);
    }
    .captured-card {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.4), 0 12px 30px -10px rgba(16, 185, 129, 0.2);
    }
    .selected-adventure {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35);
    }
    .selected-tier {
      border-color: #10b981 !important;
      background-color: rgba(16, 185, 129, 0.07) !important;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.35);
    }
    .purchased-item {
      border-color: rgba(16, 185, 129, 0.5) !important;
      opacity: 0.82;
    }
    .packed-done {
      border-color: rgba(16, 185, 129, 0.45) !important;
      background-color: rgba(16, 185, 129, 0.06) !important;
    }
    .packed-done .pack-label {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    @media print {
      @page {
        size: letter portrait;
        margin: 0.4in;
      }
      body {
        background-color: #ffffff !important;
        color: #0f172a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page-break {
        page-break-before: always;
        break-before: page;
      }
      .print-avoid-break {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      body.print-selected-only .option-card:not(.selected-adventure) {
        display: none !important;
      }
      body.print-selected-only .options-grid {
        grid-template-columns: 1fr !important;
      }
      .print-card {
        background-color: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
        box-shadow: none !important;
      }
      .print-dark-text {
        color: #0f172a !important;
      }
      .print-muted-text {
        color: #334155 !important;
      }
      .print-badge {
        border: 1px solid #64748b !important;
        color: #0f172a !important;
        background-color: #f1f5f9 !important;
      }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

  <!-- AES-256 Password Gate Screen -->
  <div id="lockScreen" class="min-h-screen flex items-center justify-center px-4 py-12 bg-gradient-to-b from-slate-900 via-[#0b0f14] to-[#0b0f14]">
    <div class="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-3xl p-7 sm:p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-2xl mb-1">

        <h1 class="serif-title text-2xl sm:text-3xl font-bold text-white">Costa Rica 2026</h1>
        <p class="text-xs sm:text-sm text-slate-400">Nov 16–23, 2026 • 24-Species Interactive Wildlife & Photography Lookbook</p>
      </div>

      <form id="unlockForm" class="space-y-4" onsubmit="handleUnlock(event)">
        <div>
          <label for="passInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Enter Trip Password</label>
          <input
            id="passInput"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••••••••"
            required
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-400 focus:outline-none text-white text-sm tracking-wide"
          />
        </div>

        <div id="errorMsg" class="hidden text-xs font-semibold text-rose-400 bg-rose-950/50 border border-rose-500/30 rounded-xl px-3.5 py-2.5">
          Incorrect password. Please try again.
        </div>

        <label class="flex items-center gap-2.5 text-xs text-slate-300 cursor-pointer select-none">
          <input id="rememberCheck" type="checkbox" checked class="rounded border-slate-700 bg-slate-950 text-emerald-500 focus:ring-0" />
          <span>Remember this device across both trip pages</span>
        </label>

        <button
          id="unlockBtn"
          type="submit"
          class="w-full py-3 rounded-xl text-sm font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg transition cursor-pointer"
        >
          Unlock Trip Guide →
        </button>
      </form>

      <div class="pt-3 border-t border-slate-800/80 text-center text-[11px] text-slate-500">
        Protected with client-side PBKDF2-SHA256 &amp; AES-256-CBC encryption.
      </div>
    </div>
  </div>

    const STORAGE_KEY = 'cr26_portal_pass_v1';

    function decryptWithPassword(password) {
      try {
        const salt = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.salt);
        const iv = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.iv);
        const ctWords = CryptoJS.enc.Base64.parse(ENC_PAYLOAD.ct);

        // Derive 64 bytes (512 bits = 16 words): first 8 words AES-256 key, next 8 words HMAC-SHA256 key
        const derived = CryptoJS.PBKDF2(password, salt, {
          keySize: 512 / 32,
          iterations: ENC_PAYLOAD.iter,
          hasher: CryptoJS.algo.SHA256
        });

        const aesKey = CryptoJS.lib.WordArray.create(derived.words.slice(0, 8), 32);
        const hmacKey = CryptoJS.lib.WordArray.create(derived.words.slice(8, 16), 32);

        // Verify HMAC-SHA256 over (iv || ciphertext)
        const dataToMac = iv.clone().concat(ctWords);
        const computedTag = CryptoJS.HmacSHA256(dataToMac, hmacKey).toString(CryptoJS.enc.Hex);
        if (computedTag !== ENC_PAYLOAD.tag) {
          return null;
        }

        // Decrypt AES-256-CBC
        const decrypted = CryptoJS.AES.decrypt(
          { ciphertext: ctWords },
          aesKey,
          { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const jsonStr = decrypted.toString(CryptoJS.enc.Utf8);
        if (!jsonStr) return null;
        return JSON.parse(jsonStr);
      } catch (e) {
        return null;
      }
    }

    function renderUnlockedPayload(data) {
      window.__CR26_CSV__ = data.csv;
      window.downloadBudgetCsv = function() {
        const blob = new Blob([window.__CR26_CSV__], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Costa_Rica_2026_Master_Trip_Budget.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };
      window.lockPortal = function() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        window.location.reload();
      };

      const container = document.createElement('div');
      container.innerHTML = data.bodyHtml;

      // Extract scripts so we can execute them after injecting HTML
      const scripts = Array.from(container.querySelectorAll('script'));
      scripts.forEach(s => s.parentNode.removeChild(s));

      document.body.innerHTML = container.innerHTML;

      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    }

    function handleUnlock(e) {
      if (e) e.preventDefault();
      const pass = document.getElementById('passInput').value.trim();
      const remember = document.getElementById('rememberCheck').checked;
      const errEl = document.getElementById('errorMsg');

      const data = decryptWithPassword(pass);
      if (!data) {
        errEl.classList.remove('hidden');
        return;
      }

      try {
        if (remember) {
          localStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(pass))));
        } else {
          sessionStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(pass))));
        }
      } catch (err) {}

      renderUnlockedPayload(data);
    }

    // Auto-unlock if already authenticated in this browser
    (function autoCheck() {
      try {
        const savedB64 = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        if (savedB64) {
          const savedPass = decodeURIComponent(escape(atob(savedB64)));
          const data = decryptWithPassword(savedPass);
          if (data) {
            renderUnlockedPayload(data);
            return;
          }
        }
      } catch (e) {}
      const input = document.getElementById('passInput');
      if (input) input.focus();
    })();
