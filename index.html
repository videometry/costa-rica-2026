        return JSON.parse(jsonStr);
      } catch (e) {
        return null;
      }
    }

    function renderUnlockedPayload(data) {
      window.__CR26_CSV__ = data.csv;
      window.downloadBudgetCsv = function() {
        const blob = new Blob([window.__CR26_CSV__], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Costa_Rica_2026_Master_Trip_Budget.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };
      window.lockPortal = function() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        window.location.reload();
      };

      const container = document.createElement('div');
      container.innerHTML = data.bodyHtml;

      // Extract scripts so we can execute them after injecting HTML
      const scripts = Array.from(container.querySelectorAll('script'));
      scripts.forEach(s => s.parentNode.removeChild(s));

      document.body.innerHTML = container.innerHTML;

      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    }

    function handleUnlock(e) {
      if (e) e.preventDefault();
      const pass = document.getElementById('passInput').value.trim();
      const remember = document.getElementById('rememberCheck').checked;
      const errEl = document.getElementById('errorMsg');

      const data = decryptWithPassword(pass);
      if (!data) {
        errEl.classList.remove('hidden');
        return;
      }

      try {
        if (remember) {
          localStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(pass))));
        } else {
          sessionStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(pass))));
        }
      } catch (err) {}

      renderUnlockedPayload(data);
    }

    // Auto-unlock if already authenticated in this browser
    (function autoCheck() {
      try {
        const savedB64 = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        if (savedB64) {
          const savedPass = decodeURIComponent(escape(atob(savedB64)));
          const data = decryptWithPassword(savedPass);
          if (data) {
            renderUnlockedPayload(data);
            return;
          }
        }
      } catch (e) {}
      const input = document.getElementById('passInput');
      if (input) input.focus();
    })();
  </script>
